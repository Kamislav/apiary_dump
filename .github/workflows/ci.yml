name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1"]
        suite: [unit, functional]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, xml
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests/${{ matrix.suite }}/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - run: composer audit --locked
